name: Validate Lab importer
on:
  push:
    paths: ['scripts/**', 'tests/**', 'content/lab-sources.json', 'automation/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'content/lab-sources.json', 'automation/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node --test tests/*.test.mjs
# Scheduled publishing runs only in nippysky-ai-labs/portfolio-sync.
